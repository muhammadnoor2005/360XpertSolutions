version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: products
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    image: redis
    ports:
      - "6379:6379"

  nodeapp:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ./
        target: /app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5432/testdb?schema=public
    command: sh -c "npm install --unsafe-perm && npx prisma generate && npm run dev"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

